name = "bolster-help"
main = "src/index.js"
compatibility_date = "2026-05-01"

[vars]
MCP_ORIGIN = "https://mcp.bolster.online/mcp"
ALLOWED_ORIGINS = "https://bolster.help,http://localhost:5173"

# Cloudflare's rate-limiting binding rather than a KV counter: the free tier
# allows 1K KV writes/day, which a per-request counter would exhaust in minutes.
[[unsafe.bindings]]
name = "MCP_RATE_LIMIT"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 30, period = 60 }
