name = "bolster-help"
main = "src/index.js"
compatibility_date = "2026-05-01"

[vars]
MCP_ORIGIN = "https://mcp.bolster.online/mcp"
ALLOWED_ORIGINS = "https://bolster.help,http://localhost:5173"

# Cloudflare's rate-limiting binding rather than a KV counter: the free tier
# allows 1K KV writes/day, which a per-request counter would exhaust in minutes.
[[unsafe.bindings]]
name = "MCP_RATE_LIMIT"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

# Sessions only — one write per login, so the 1K/day write cap is not a concern.
# Replace the id after `wrangler kv namespace create SESSIONS`.
[[kv_namespaces]]
binding = "SESSIONS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Replace the id after `wrangler d1 create bolster-help`.
[[d1_databases]]
binding = "DB"
database_name = "bolster-help"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
