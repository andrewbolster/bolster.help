name = "bolster-help"
main = "src/index.js"
compatibility_date = "2026-05-01"
account_id = "1a929e6f9bfe075e1a8dd9f9003497d1"

[vars]
MCP_ORIGIN = "https://mcp.bolster.online/mcp"
ALLOWED_ORIGINS = "https://bolster.help,https://www.bolster.help,http://localhost:5173"

# Who may spend the deployment's own LLM credentials. Empty means nobody, which
# is the right default: every other visitor brings their own key.
GITHUB_ALLOWED_LOGINS = "andrewbolster"

# Chosen by measuring tool-selection accuracy against the retrieval fixtures,
# not by price: 12/12 on the cases that matter at ~1.2 neurons a round. The
# reasoning models cost ten times as much and chose worse.
WORKERS_AI_MODEL = "@cf/ibm-granite/granite-4.0-h-micro"

# LLM_BASE_URL, LLM_API_KEY and LLM_MODEL are secrets, not vars — set them with
# `wrangler secret put`. Leaving them unset means allowlisted accounts fall back
# to the same free tier as everyone else.

# Inference for visitors who are not signed in. On the Workers Free plan the
# 10,000 neuron/day allocation is enforced by Cloudflare and cannot be exceeded,
# so this cannot produce a bill.
[ai]
binding = "AI"

# The neuron counter. A Durable Object rather than KV: KV is eventually
# consistent with last-write-wins, so a read-modify-write counter loses updates,
# and its 1K/day write cap is lower than the questions a day of neurons buys.
[[durable_objects.bindings]]
name = "NEURON_BUDGET"
class_name = "NeuronBudget"

# Declarative in preference to the legacy [[migrations]] array: that array
# tracks lifecycle by an ever-growing list of tags, and a Worker whose
# provisioning history came from the raw scripts API (see git history of
# worker/deploy.sh) doesn't necessarily agree with wrangler about which tags
# are already applied — deploying with `tag = "v1"` here once failed with
# "Cannot apply new-sqlite-class migration ... already depended on by
# existing Durable Objects [code: 10074]" even though the class had been live
# for months. `exports` instead declares the class's current desired state;
# Cloudflare reconciles that against what's actually provisioned rather than
# replaying a migration step, so re-declaring the same live entry on every
# deploy is a no-op by design, not by luck.
[exports.NeuronBudget]
type = "durable-object"
storage = "sqlite"

# Sessions only — one write per login, so the 1K/day write cap is not a concern.
# Replace the id after `wrangler kv namespace create SESSIONS`.
[[kv_namespaces]]
binding = "SESSIONS"
id = "7683a8d90ea6451bace7e2458cd8fe17"

# Replace the id after `wrangler d1 create bolster-help`.
[[d1_databases]]
binding = "DB"
database_name = "bolster-help"
database_id = "81abb174-fba4-4181-9e6f-adef56df939f"
