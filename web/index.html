<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>bolster.help</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <h1>bolster.help</h1>
      <p id="account">
        <button id="signin" type="button" class="link">Sign in with GitHub</button>
        <span id="whoami" hidden></span>
      </p>
    </header>

    <main>
      <!-- No setup step: the page is the chat. Tools and the MCP connection are
           established in the background, and the composer stays live throughout. -->
      <div id="budget" hidden>
        <div id="budget-track"><div id="budget-fill"></div></div>
        <p id="budget-note"></p>
      </div>

      <ol id="transcript"></ol>

      <form id="composer">
        <label class="visually-hidden" for="prompt">Message</label>
        <input id="prompt" type="text" autocomplete="off" placeholder="Ask me something…" autofocus />
        <button type="submit">Send</button>
      </form>

      <p id="progress" role="status"></p>

      <p id="chat-actions">
        <button id="save-chat" type="button" class="secondary" hidden>Save conversation</button>
        <span id="save-state"></span>
      </p>
    </main>

    <script type="module" src="./src/app.js"></script>
  </body>
</html>
