name: worker

# Deploys worker/ to Cloudflare on every push to main that touches it.
#
# wrangler deploy reads worker/wrangler.toml directly, so that file is the
# only place bindings are declared — there is no second, hand-copied list to
# keep in step with it. A worker/deploy.sh used to exist to work around an API
# token that (at the time) could not read /accounts/{id}/workers/subdomain,
# which wrangler checks on every deploy; that token now can, so the plain
# tool replaces the workaround.

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/worker.yml"
  workflow_dispatch:

permissions:
  contents: read

# Never let two deploys race for the live Worker; queue instead of
# cancelling, so the last push to land is the one that ends up served.
concurrency:
  group: worker-deploy
  cancel-in-progress: false

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm test

  deploy:
    name: deploy
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-worker
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: worker
          # Pinned: nothing else in the repo pins a wrangler version, and this
          # is the one deploying to production.
          wranglerVersion: "4.127.1"
      # After the deploy, not before: Cloudflare refuses secret edits while the
      # latest Worker version is undeployed (error 10215), and the action's own
      # `secrets` input uploads first.
      - name: Upload Worker secrets
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # GitHub reserves the GITHUB_ prefix for secret names, hence GH_OAUTH_*.
          CLIENT_ID: ${{ secrets.GH_OAUTH_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.GH_OAUTH_CLIENT_SECRET }}
          USER_CONFIG_KEY: ${{ secrets.USER_CONFIG_KEY }}
        run: |
          umask 077
          # USER_CONFIG_KEY is left out when empty, never uploaded as a blank.
          jq -n --arg id "$CLIENT_ID" --arg secret "$CLIENT_SECRET" --arg config "$USER_CONFIG_KEY" \
            '{GITHUB_CLIENT_ID: $id, GITHUB_CLIENT_SECRET: $secret} + (if $config == "" then {} else {USER_CONFIG_KEY: $config} end)' \
            > "$RUNNER_TEMP/secrets.json"
          npx --yes wrangler@4.127.1 secret bulk "$RUNNER_TEMP/secrets.json"
