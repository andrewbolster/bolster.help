name: ci

on:
  push:
    branches: [main]
  pull_request:
  # tools.json is a manual snapshot with no refresh trigger, and the proxy
  # allowlist is hand-written against it. Drift is silent — retrieval starts
  # offering a tool that no longer exists, or never offers one that does — so
  # the network checks run on a schedule rather than waiting for someone to
  # notice. Monday morning, off the hour to avoid the cron stampede.
  schedule:
    - cron: "37 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      # Kept as its own job rather than folded into pre-commit-in-CI like
      # the Python repos — this is the first lint tooling bolster.help has
      # had at all, worth verifying in isolation before trusting the same
      # pattern here too.
      - run: npx biome ci .

  test:
    name: unit and worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      # Runs both projects: plain Node for the pure logic, and workerd via
      # Cloudflare's plugin for anything touching a binding. No credentials
      # needed — the test wrangler config omits the bindings that would
      # require a remote proxy session.
      - run: npm test

  upstream:
    name: upstream drift
    runs-on: ubuntu-latest
    # Only where a failure means something actionable. On a pull request the
    # MCP server is not what changed, and a red X for someone else's outage
    # teaches people to ignore the check.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run test:network
